<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <title>screenshot notebook</title>
    <link rel="stylesheet" href="index.css"/>
  </head>
  <body>
    <div id="viewer">
      <div id="welcome-message">
        <h1>Welcome to screenshot notebook</h1>
        <ul class="shortcut-list">
          <li><span>Take a screenshot</span><span class="shortcut-icon whole">+</span><kbd>Ctrl+A</kbd></li>
          <li><span>Snip part of the screen</span><span class="shortcut-icon snip">☐</span><kbd>Ctrl+S</kbd></li>
          <li><span>Copy the screenshot</span><span class="shortcut-icon copy">C</span><kbd>Ctrl+C</kbd></li>
          <li><span>Delete the screenshot</span><kbd>Ctrl+D</kbd></li>
          <li><span>Switch between screenshots</span><kbd>← / →</kbd></li>
        </ul>
      </div>
      <img id="screenshot">
    </div>
    <div id="navbar">
      <div id="left-panel">
        <button id="screenshot-btn-whole">+</button>
        <button id="screenshot-btn-snip">☐</button>
        <button id="screenshot-btn-copy">C</button>
      </div>
      <div id="tab-bar">
      </div>
    </div>
    <div id="copy-toast">Copied screenshot</div>
    <script defer src="renderer.js"></script>
  </body>
</html>
